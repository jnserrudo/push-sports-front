<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Push Sport — En mantenimiento</title>
  <link rel="icon" type="image/jpeg" href="/icono_new.jpeg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
      padding: 24px;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 28px;
      border: 2px solid #00d2ff;
      box-shadow: 0 0 32px rgba(0, 210, 255, 0.25);
    }
    .kicker {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #00d2ff;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #a3a3a3;
    }
    .bar {
      width: 64px;
      height: 3px;
      background: #00d2ff;
      margin: 28px auto 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/icono_new.jpeg" alt="Push Sport" />
    <div class="kicker">Pushsport</div>
    <h1>Estamos en mantenimiento</h1>
    <p>Estamos actualizando el sistema. El catálogo, las sucursales y el panel no están disponibles por ahora. Volvemos en breve.</p>
    <div class="bar"></div>
  </div>
</body>
</html>
